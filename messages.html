<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messages | Nia</title>
  <meta name="theme-color" content="#000000" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/x-icon" href="assets/favicon/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="base.css" /><link rel="stylesheet" href="dash.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body data-page="messages">
  <header class="topbar">
    <div class="container topbar-in">
      <a href="dashboard.html" class="brand" aria-label="Nia"><img src="assets/images/logo2-tight.png" alt="Nia" width="40" height="40" /></a>
      <nav class="top-links"><a href="dashboard.html">Opportunities</a><a href="programs.html">Programs</a><a href="messages.html" class="active">Messages</a><a href="profile.html">My profile</a></nav>
      <div class="me">
        <button class="avatar" id="avatarBtn" aria-label="Account menu" aria-expanded="false"></button>
        <div class="menu hidden" id="menu">
          <div class="menu-head"><b id="menuName">Student</b><span id="menuEmail"></span></div>
          <a href="profile.html"><i data-lucide="user" class="icon"></i> My profile</a>
          <a href="admin.html" id="adminLink" class="hidden"><i data-lucide="layout-dashboard" class="icon"></i> Admin console</a>
          <button id="logoutBtn" class="danger"><i data-lucide="log-out" class="icon"></i> Sign out</button>
        </div>
      </div>
    </div>
  </header>
  <main class="container page">
    <div class="msg-bar"><h1 style="font-size:1.4rem;letter-spacing:-.02em">Messages</h1><button class="btn btn-ghost" id="readAll"><i data-lucide="check-check" class="icon"></i> Mark all as read</button></div>
    <div class="msglist" id="list"><div class="skel"></div><div class="skel"></div></div>
  </main>
  <script src="messages.js"></script>
  <script src="nav.js"></script>
  <script src="notify.js"></script>
  <!-- Lucide icons. For SRI run: node tools/add-sri.mjs -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <script>if(window.lucide)lucide.createIcons();window.__icons=()=>window.lucide&&lucide.createIcons();</script>
  <script src="pwa.js"></script>
</body>
</html>
