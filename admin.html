<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin | Nia</title>
  <meta name="robots" content="noindex" /><meta name="theme-color" content="#000000" />
  <link rel="icon" type="image/x-icon" href="assets/favicon/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="base.css" /><link rel="stylesheet" href="dash.css" /><link rel="stylesheet" href="admin.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="shell">
    <aside>
      <a href="admin.html" class="wordmark" aria-label="Nia admin"><img src="assets/images/logo2-tight.png" alt="Nia" width="38" height="38" /><span class="tag">ADMIN</span></a>
      <nav class="nv" id="nav">
        <a href="#overview" data-v="overview"><i data-lucide="layout-dashboard" class="icon"></i>Overview</a>
        <a href="#opportunities" data-v="opportunities"><i data-lucide="briefcase" class="icon"></i>Listings</a>
        <a href="#applications" data-v="applications"><i data-lucide="inbox" class="icon"></i>Applicants</a>
        <a href="#users" data-v="users"><i data-lucide="users" class="icon"></i>Users</a>
        <a href="#fields" data-v="fields" data-admin><i data-lucide="list-checks" class="icon"></i>Details</a>

        <span class="sp"></span>

        <button id="logoutBtn"><i data-lucide="log-out" class="icon"></i>Sign out</button>
      </nav>
    </aside>
    <main class="main" id="view"><div class="empty">Loading…</div></main>
  </div>
  <div id="modal" class="modal-overlay hidden" role="dialog" aria-modal="true"><div class="modal sheet m-lg" id="modalBody"></div></div>
  <script src="admin.js"></script>
  <!-- Lucide icons. For SRI: curl -s <URL> | openssl dgst -sha384 -binary | openssl base64 -A, then add integrity + crossorigin -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <script>if(window.lucide)lucide.createIcons();window.__icons=()=>window.lucide&&lucide.createIcons();</script>
