<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" /><meta name="theme-color" content="#000000" />
  <link rel="icon" type="image/x-icon" href="assets/favicon/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="base.css" /><link rel="stylesheet" href="auth.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <title>Reset password | Nia</title>
</head>
<body>
  <a href="index.html" class="auth-brand" aria-label="Nia home"><img src="assets/images/logo2-tight.png" alt="Nia" width="56" height="56" /></a>
  <main class="auth-card">
    <div class="auth-ic"><i data-lucide="mail" class="icon" style="width:22px;height:22px"></i></div>
    <h1>Reset your password</h1>
    <p class="sub">Enter the email you registered with and we will send you a recovery link.</p>
    <div id="resetStatus" class="message hidden" role="status"></div>
    <form id="requestResetForm">
      <div class="form-group"><label for="resetEmail">Email address</label><input type="email" id="resetEmail" required placeholder="you@example.com" autocomplete="email" /></div>
      <div id="cfTurnstile" class="cf-ts"></div>
      <button type="submit" id="sendResetBtn" class="btn btn-submit">Send recovery link</button>
    </form>
    <a href="index.html" class="auth-back"><i data-lucide="arrow-left" class="icon"></i> Back to sign in</a>
  </main>
  <p class="auth-foot">&copy; <span id="yr">2026</span> Nia Kenya</p>

  <script src="captcha.js"></script>
  <script>
    const GATEWAY_URL = "https://nia-gateway.davidkasimilu71.workers.dev";
    const EDGE_KEY = "cf-worker-edge-managed";
    const sb = window.supabase ? window.supabase.createClient(GATEWAY_URL, EDGE_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } }) : null;
    const $ = (id) => document.getElementById(id);
    $("yr").textContent = new Date().getFullYear();
    if (window.NiaCaptcha) NiaCaptcha.ensure();
    function show(text, err) { const m = $("resetStatus"); m.className = "message " + (err ? "error" : "info"); m.textContent = text; }
    $("requestResetForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = $("sendResetBtn"), email = $("resetEmail").value.trim();
      btn.disabled = true; btn.textContent = "Sending…";
      try {
        const redirectTo = `${location.origin}${location.pathname.replace("reset-password.html", "update-password.html")}`;
        const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo, captchaToken: window.NiaCaptcha ? await NiaCaptcha.getToken() : undefined });
        if (error) show(error.message, true);
        else { show("If an account exists for that email, a recovery link is on its way. Check your inbox and spam folder."); e.target.reset(); }
      } catch (err) { show(err.message || "Failed to process request.", true); }
      btn.disabled = false; btn.textContent = "Send recovery link";
    });
  </script>
  <!-- Lucide icons. For SRI: curl -s <URL> | openssl dgst -sha384 -binary | openssl base64 -A, then add integrity + crossorigin -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <script>if(window.lucide)lucide.createIcons();</script>
</body>
</html>
