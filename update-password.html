<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" /><meta name="theme-color" content="#000000" />
  <link rel="icon" type="image/x-icon" href="assets/favicon/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="base.css" /><link rel="stylesheet" href="auth.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <title>Set new password | Nia</title>
</head>
<body>
  <a href="index.html" class="auth-brand" aria-label="Nia home"><img src="assets/images/logo2-tight.png" alt="Nia" width="56" height="56" /></a>
  <main class="auth-card">
    <div class="auth-ic"><i data-lucide="key-round" class="icon" style="width:22px;height:22px"></i></div>
    <h1>Set a new password</h1>
    <p class="sub" id="subText">Choose a new password for your Nia account.</p>
    <div id="updateStatus" class="message hidden" role="status"></div>
    <form id="newPasswordForm">
      <div class="form-group"><label for="newPassword">New password</label><input type="password" id="newPassword" required minlength="6" placeholder="At least 6 characters" autocomplete="new-password" /></div>
      <div class="form-group"><label for="confirmPassword">Confirm new password</label><input type="password" id="confirmPassword" required minlength="6" placeholder="Repeat new password" autocomplete="new-password" /></div>
      <button type="submit" id="updateBtn" class="btn btn-submit">Update password</button>
    </form>
    <a href="index.html" class="auth-back"><i data-lucide="arrow-left" class="icon"></i> Back to sign in</a>
  </main>
  <p class="auth-foot">&copy; <span id="yr">2026</span> Nia Kenya</p>

  <script>
    const GATEWAY_URL = "https://nia-gateway.davidkasimilu71.workers.dev";
    const EDGE_KEY = "cf-worker-edge-managed";
    const sb = window.supabase ? window.supabase.createClient(GATEWAY_URL, EDGE_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } }) : null;
    const $ = (id) => document.getElementById(id);
    $("yr").textContent = new Date().getFullYear();
    function show(text, err) { const m = $("updateStatus"); m.className = "message " + (err ? "error" : "info"); m.textContent = text; }

    // A valid recovery link signs the user in temporarily. No session means the link is missing, used or expired.
    (async () => {
      if (!sb) return;
      const { data: { session } } = await sb.auth.getSession();
      if (!session) {
        $("newPasswordForm").classList.add("hidden");
        $("subText").textContent = "";
        show("This recovery link is invalid or has expired. Request a new one to continue.", true);
        const a = document.createElement("a"); a.href = "reset-password.html"; a.className = "btn btn-submit"; a.style.marginTop = ".25rem"; a.textContent = "Request a new link";
        $("updateStatus").after(a);
      }
    })();

    $("newPasswordForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const pw = $("newPassword").value, btn = $("updateBtn");
      if (pw !== $("confirmPassword").value) return show("Passwords do not match.", true);
      btn.disabled = true; btn.textContent = "Updating…";
      try {
        const { error } = await sb.auth.updateUser({ password: pw });
        if (error) { show(error.message, true); btn.disabled = false; btn.textContent = "Update password"; return; }
        show("Password updated. Redirecting you to sign in…");
        setTimeout(async () => { await sb.auth.signOut(); location.href = "index.html"; }, 1800);
      } catch (err) { show(err.message || "Failed to update password.", true); btn.disabled = false; btn.textContent = "Update password"; }
    });
  </script>
  <!-- Lucide icons. For SRI: curl -s <URL> | openssl dgst -sha384 -binary | openssl base64 -A, then add integrity + crossorigin -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <script>if(window.lucide)lucide.createIcons();</script>
</body>
</html>
